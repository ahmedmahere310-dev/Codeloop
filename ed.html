<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CodeLoop - محرر الأكواد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        #editor { height: calc(100vh - 60px); width: 100%; }
        .glass { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body class="flex flex-col">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 bg-[#0a0a0a] border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-tr from-blue-700 to-indigo-500 rounded-lg flex items-center justify-center">
                <i data-lucide="code" class="w-4 h-4 text-white"></i>
            </div>
            <span class="font-bold text-sm">محرر CodeLoop</span>
        </div>
        <div class="flex gap-2">
            <button onclick="saveCode()" class="px-4 py-1.5 bg-blue-600 rounded-lg text-xs font-bold">حفظ</button>
            <button onclick="runPreview()" class="px-4 py-1.5 bg-green-600 rounded-lg text-xs font-bold">تشغيل</button>
            <button onclick="publishPost()" class="px-4 py-1.5 bg-purple-600 rounded-lg text-xs font-bold">نشر</button>
            <button onclick="goBack()" class="px-4 py-1.5 bg-white/10 rounded-lg text-xs font-bold">رجوع</button>
        </div>
    </div>

    <!-- Main Area -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Files -->
        <div class="w-48 bg-[#050505] border-l border-white/10 p-2 overflow-y-auto">
            <button onclick="newFile()" class="w-full mb-2 px-3 py-1.5 bg-white/5 rounded-lg text-xs flex items-center gap-2">
                <i data-lucide="plus" class="w-3 h-3"></i> ملف جديد
            </button>
            <div id="file-list" class="space-y-1"></div>
        </div>

        <!-- Editor -->
        <div class="flex-1 flex flex-col">
            <!-- Tabs -->
            <div id="tabs" class="flex gap-1 px-2 overflow-x-auto bg-[#0a0a0a] border-b border-white/10"></div>
            <!-- Ace Editor -->
            <div id="editor" class="flex-1"></div>
        </div>

        <!-- Preview Panel -->
        <div id="preview-panel" class="w-1/2 bg-white hidden flex-col border-r border-white/10">
            <div class="px-3 py-2 bg-[#0a0a0a] border-b border-white/10 flex justify-between">
                <span class="text-xs font-bold">المعاينة</span>
                <button onclick="togglePreview()" class="text-gray-400">✕</button>
            </div>
            <iframe id="preview-frame" class="flex-1 bg-white"></iframe>
        </div>
    </div>

    <!-- Publish Modal -->
    <div id="publish-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
        <div class="bg-[#0a0a0a] rounded-2xl p-6 w-full max-w-md border border-white/10">
            <h3 class="font-bold text-lg mb-4">نشر المشروع</h3>
            <input type="text" id="pub-title" placeholder="عنوان المشروع" class="w-full bg-black rounded-xl p-3 mb-3 border border-white/10 outline-none">
            <textarea id="pub-desc" placeholder="وصف المشروع" rows="3" class="w-full bg-black rounded-xl p-3 mb-3 border border-white/10 outline-none"></textarea>
            <select id="pub-lang" class="w-full bg-black rounded-xl p-3 mb-4 border border-white/10">
                <option value="HTML">HTML/CSS</option><option value="JavaScript">JavaScript</option><option value="Python">Python</option>
            </select>
            <div class="flex gap-3">
                <button onclick="submitPublish()" class="flex-1 bg-green-600 py-3 rounded-xl font-bold">نشر</button>
                <button onclick="closePublishModal()" class="flex-1 bg-white/10 py-3 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

<script>
// File system
let files = [
    { id: '1', name: 'index.html', content: `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>CodeLoop</title><script src="https://cdn.tailwindcss.com"><\/script></head>
<body class="bg-black text-white p-8"><h1 class="text-3xl font-bold text-blue-500">مرحباً بك!</h1><p>حرر هذا الكود وشاهد النتيجة</p></body>
</html>` },
    { id: '2', name: 'style.css', content: 'body { margin: 0; padding: 20px; }' },
    { id: '3', name: 'script.js', content: 'console.log("Hello CodeLoop!");' }
];
let activeFileId = '1';
let openTabs = ['1', '2', '3'];
let editor = null;

// Load saved data
const saved = localStorage.getItem('cl_editor_files');
if (saved) {
    try {
        files = JSON.parse(saved);
        openTabs = files.map(f => f.id);
        activeFileId = files[0]?.id || '1';
    } catch(e) {}
}

function initEditor() {
    editor = ace.edit("editor");
    editor.setTheme("ace/theme/tomorrow_night_eighties");
    editor.session.setMode("ace/mode/html");
    editor.setOptions({ fontSize: "14px", wrap: true });
    editor.session.on('change', () => {
        const file = files.find(f => f.id === activeFileId);
        if (file) file.content = editor.getValue();
        localStorage.setItem('cl_editor_files', JSON.stringify(files));
    });
    loadFile();
    renderFiles();
    renderTabs();
}

function loadFile() {
    const file = files.find(f => f.id === activeFileId);
    if (!file) return;
    editor.setValue(file.content, -1);
    let mode = "ace/mode/text";
    if (file.name.endsWith('.html')) mode = "ace/mode/html";
    else if (file.name.endsWith('.css')) mode = "ace/mode/css";
    else if (file.name.endsWith('.js')) mode = "ace/mode/javascript";
    editor.session.setMode(mode);
}

function renderFiles() {
    const container = document.getElementById('file-list');
    container.innerHTML = files.map(file => `
        <div onclick="switchFile('${file.id}')" class="px-3 py-2 rounded-lg text-xs cursor-pointer ${file.id === activeFileId ? 'bg-blue-600/20' : 'hover:bg-white/5'}">
            <i data-lucide="file-code" class="w-3 h-3 inline ml-1"></i> ${file.name}
        </div>
    `).join('');
    lucide.createIcons();
}

function renderTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = openTabs.map(id => {
        const file = files.find(f => f.id === id);
        if (!file) return '';
        return `
            <div onclick="switchFile('${id}')" class="px-3 py-1.5 text-xs rounded-t-lg cursor-pointer ${id === activeFileId ? 'bg-[#1a1a1a] text-white' : 'bg-transparent text-gray-400'}">
                ${file.name} <span onclick="event.stopPropagation(); closeTab('${id}')" class="ml-1 text-gray-500 hover:text-red-400">✕</span>
            </div>
        `;
    }).join('');
}

function switchFile(id) {
    activeFileId = id;
    if (!openTabs.includes(id)) openTabs.push(id);
    loadFile();
    renderFiles();
    renderTabs();
}

function closeTab(id) {
    openTabs = openTabs.filter(t => t !== id);
    if (activeFileId === id && openTabs.length > 0) switchFile(openTabs[0]);
    else if (openTabs.length === 0) {
        const newId = Date.now().toString();
        files.push({ id: newId, name: 'newfile.html', content: '' });
        openTabs = [newId];
        switchFile(newId);
    }
    renderTabs();
}

function newFile() {
    const name = prompt('اسم الملف:', 'newfile.html');
    if (!name) return;
    const newId = Date.now().toString();
    files.push({ id: newId, name: name, content: '' });
    openTabs.push(newId);
    switchFile(newId);
    localStorage.setItem('cl_editor_files', JSON.stringify(files));
}

function saveCode() {
    const file = files.find(f => f.id === activeFileId);
    if (file) file.content = editor.getValue();
    localStorage.setItem('cl_editor_files', JSON.stringify(files));
    showToast('تم الحفظ');
}

function runPreview() {
    const file = files.find(f => f.id === activeFileId);
    if (!file) return;
    let html = file.content;
    // Include CSS and JS files
    files.forEach(f => {
        if (f.id !== activeFileId) {
            if (f.name.endsWith('.css')) {
                html = html.replace(`<link rel="stylesheet" href="${f.name}">`, `<style>${f.content}</style>`);
            } else if (f.name.endsWith('.js')) {
                html = html.replace(`<script src="${f.name}"><\/script>`, `<script>${f.content}<\/script>`);
            }
        }
    });
    const frame = document.getElementById('preview-frame');
    frame.srcdoc = html;
    document.getElementById('preview-panel').classList.remove('hidden');
    document.getElementById('preview-panel').classList.add('flex');
}

function togglePreview() {
    const panel = document.getElementById('preview-panel');
    panel.classList.add('hidden');
    panel.classList.remove('flex');
}

function publishPost() {
    const file = files.find(f => f.id === activeFileId);
    if (!file) return;
    document.getElementById('pub-title').value = file.name.replace('.html', '');
    document.getElementById('pub-desc').value = '';
    document.getElementById('publish-modal').classList.remove('hidden');
    document.getElementById('publish-modal').classList.add('flex');
}

function closePublishModal() {
    document.getElementById('publish-modal').classList.add('hidden');
    document.getElementById('publish-modal').classList.remove('flex');
}

async function submitPublish() {
    const title = document.getElementById('pub-title').value;
    const desc = document.getElementById('pub-desc').value;
    const lang = document.getElementById('pub-lang').value;
    const code = editor.getValue();
    const userId = localStorage.getItem('cl_user_id') || 'guest';
    const userName = localStorage.getItem('cl_username') || 'مطور';
    
    if (!title) {
        showToast('الرجاء إدخال عنوان');
        return;
    }
    
    // Firebase imports
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
    const { getDatabase, ref, push, set, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
    
    const firebaseConfig = {
        apiKey: "AIzaSyCGnyVjU_sfU3KfVHW-wyBzE5ufJHFXL8s",
        authDomain: "es-store-409a3.firebaseapp.com",
        databaseURL: "https://es-store-409a3-default-rtdb.firebaseio.com",
        projectId: "es-store-409a3",
        storageBucket: "es-store-409a3.firebasestorage.app",
        messagingSenderId: "175100432019",
        appId: "1:175100432019:web:42754dcbeca82c638c4766"
    };
    
    const app = initializeApp(firebaseConfig);
    const rdb = getDatabase(app);
    const DB_ROOT = "codeloop_pro_v3";
    
    const newPostRef = push(ref(rdb, `${DB_ROOT}/posts`));
    await set(newPostRef, {
        title, description: desc, code, language: lang,
        authorName: userName, authorId: userId,
        likes: 0, likedBy: {}, comments: {}, views: 0,
        timestamp: Date.now(), createdAt: serverTimestamp()
    });
    
    showToast('تم النشر بنجاح!');
    closePublishModal();
    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
}

function goBack() {
    window.location.href = 'index.html';
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-full text-sm z-50';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

initEditor();
lucide.createIcons();
</script>
</body>
</html>
